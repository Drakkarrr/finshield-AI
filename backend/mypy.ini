[mypy]
python_version = 3.11
ignore_missing_imports = True

# Debt: the ORM uses legacy `Column()` declarations, so mypy sees instance attributes as
# Column[...] and flags every read/assignment. Cleared by migrating db_models to Mapped[]
# (S1.2) (routes now live in app/api/, split in S1.6). Only these codes are disabled, so e.g. name-defined
# and return-value errors still fail CI.
[mypy-app.api.*]
disable_error_code = arg-type, assignment, index, union-attr, var-annotated, type-var, call-overload, operator, attr-defined

[mypy-app.auth]
disable_error_code = arg-type, assignment

# pgvector's Vector column type is untyped.
[mypy-app.db_models]
disable_error_code = var-annotated

# Seed rows are dict literals splatted as **kwargs.
[mypy-app.seed_rag_data]
disable_error_code = arg-type
