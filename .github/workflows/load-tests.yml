name: Nightly Load Tests

on:
  schedule:
    # Run at 2 AM UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  K6_VERSION: '0.49.0'

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup k6
        run: |
          wget https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz
          tar -xzf k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/
          k6 version
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            if curl -f ${{ secrets.BASE_URL }}/api/health/ready; then
              echo "Services are ready!"
              break
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
      
      - name: Run load tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          k6 run \
            --out json=results.json \
            --summary-export=summary.json \
            tests/load/k6-load-test.js
      
      - name: Parse results
        if: always()
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract key metrics
          python3 << 'EOF'
          import json
          
          with open('summary.json') as f:
              data = json.load(f)
          
          metrics = data.get('metrics', {})
          
          # HTTP request duration
          http_duration = metrics.get('http_req_duration', {}).get('values', {})
          print(f"**HTTP Request Duration:**")
          print(f"- Average: {http_duration.get('avg', 0):.2f}ms")
          print(f"- p95: {http_duration.get('p(95)', 0):.2f}ms")
          print(f"- Max: {http_duration.get('max', 0):.2f}ms")
          print()
          
          # Error rate
          errors = metrics.get('errors', {}).get('values', {})
          error_rate = errors.get('rate', 0) * 100
          print(f"**Error Rate:** {error_rate:.2f}%")
          print()
          
          # Request count
          http_reqs = metrics.get('http_reqs', {}).get('values', {})
          print(f"**Total Requests:** {http_reqs.get('count', 0)}")
          print(f"**Request Rate:** {http_reqs.get('rate', 0):.2f} req/s")
          EOF
      
      - name: Check thresholds
        if: always()
        run: |
          # Check if any thresholds failed
          if grep -q '"thresholds":{[^}]*"ok":false' summary.json; then
            echo "❌ Load test thresholds FAILED"
            echo "Check the summary for details"
            exit 1
          else
            echo "✅ All load test thresholds PASSED"
          fi
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: |
            results.json
            summary.json
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Load Test Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `Load test failed in ${{ github.event.inputs.environment || 'staging' }} environment.\n\n[View results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nCheck the artifacts for detailed metrics.`,
              labels: ['bug', 'performance', 'automated-report']
            })

  performance-regression:
    runs-on: ubuntu-latest
    needs: load-test
    if: always()
    
    steps:
      - name: Download previous results
        uses: actions/download-artifact@v4
        with:
          name: load-test-results-latest
          path: previous/
        continue-on-error: true
      
      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: current/
      
      - name: Compare performance
        run: |
          if [ -f previous/summary.json ] && [ -f current/summary.json ]; then
            python3 << 'EOF'
            import json
            
            with open('previous/summary.json') as f:
                prev = json.load(f)
            with open('current/summary.json') as f:
                curr = json.load(f)
            
            prev_p95 = prev['metrics']['http_req_duration']['values'].get('p(95)', 0)
            curr_p95 = curr['metrics']['http_req_duration']['values'].get('p(95)', 0)
            
            if prev_p95 > 0:
                change = ((curr_p95 - prev_p95) / prev_p95) * 100
                print(f"Performance change: {change:+.2f}%")
                
                if change > 20:
                    print("⚠️  WARNING: Performance degraded by more than 20%")
                    exit(1)
                elif change > 10:
                    print("⚠️  NOTICE: Performance degraded by more than 10%")
                else:
                    print("✅ Performance is stable")
            else:
                print("No previous data to compare")
          else:
            echo "No previous results found, skipping comparison"
          fi
      
      - name: Tag results as latest
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-latest
          path: current/
          retention-days: 7
