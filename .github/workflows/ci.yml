name: FinShield CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"   # must match backend/Dockerfile
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, typecheck, tests + coverage floor ──
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Run tests with coverage
        env:
          APP_ENV: test
        # Coverage floor = measured value rounded down; raise it as slices land, never lower it.
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=63

  # ── Backend on Postgres: Alembic round trip + full suite (catches dialect drift) ──
  backend-postgres:
    name: Backend on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fs
          POSTGRES_PASSWORD: fs
          POSTGRES_DB: fs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fs" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic upgrade / downgrade / upgrade
        env:
          DATABASE_URL: postgresql://fs:fs@localhost:5432/fs
          JWT_SECRET_KEY: ci-only
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep "(head)"

      - name: Create test database
        run: PGPASSWORD=fs psql -h localhost -U fs -d fs -c "CREATE DATABASE fstest"

      - name: Full suite on Postgres (schema built by migrations)
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql://fs:fs@localhost:5432/fstest
        run: pytest tests/ -v --tb=short

  # ── Frontend: typecheck, lint, build ──
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: platform-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Security: dependency audits + secret scan (all blocking) ──
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm dependencies
        working-directory: platform-app
        run: npm audit --audit-level=high

      # Scans the checked-out tree. Git history still contains the formerly tracked
      # backend/.env; purging it is a pending human decision (see PROGRESS.md).
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --no-git --source /repo --redact -v

  # ── Docker: build all images from the repo-root context ──
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-postgres, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t finshield-backend .

      - name: Build platform image
        run: docker build -f platform-app/Dockerfile -t finshield-platform .

      - name: Build website image
        run: docker build -t finshield-website ./website

      - name: Validate docker compose config
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose config --quiet

  # ── E2E: full stack + filing workflow (not a required check) ──
  e2e:
    name: E2E (compose stack)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start stack
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --build --wait

      - name: Run e2e tests
        working-directory: backend
        env:
          APP_ENV: test
          E2E_BASE_URL: http://localhost:8091
        run: |
          pip install -r requirements.txt
          pytest tests/e2e -m e2e -v

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
