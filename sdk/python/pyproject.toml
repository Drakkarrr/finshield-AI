[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finshield"
version = "0.1.0"
description = "Python client for the FinShield transaction screening API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["finshield"]
