services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finshield-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-finshield}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finshield}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: finshield-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finshield-backend
    ports:
      - "8091:8091"
    environment:
      - APP_ENV=production
      # Postgres is the primary database (D6); the RAG corpora live in the same database.
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-finshield}
      - RAG_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finshield}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RAG_EMBEDDER=${RAG_EMBEDDER:-minilm}
      # First-run list data (see backend/scripts/bootstrap.py). The demo fixtures are FICTIONAL.
      - LISTS_AUTO_DOWNLOAD=${LISTS_AUTO_DOWNLOAD:-true}
      - LISTS_DEMO_FIXTURES=${LISTS_DEMO_FIXTURES:-true}
      - CELERY_BROKER_URL=redis://redis:6379/0
      # Optional: set to expose /metrics (bearer token); unset keeps the endpoint disabled.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - DEBUG=${DEBUG:-false}
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background worker + beat (S4.1/S4.3): deliveries, sweeps, refreshes. No screening decisions.
  # Same image as the backend; its own entrypoint, so it never runs migrations concurrently.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finshield-worker
    entrypoint: ["celery", "-A", "app.worker.celery_app"]
    command: ["worker", "-B", "--loglevel=INFO", "--concurrency=2", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finshield}
      - RAG_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finshield}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RAG_EMBEDDER=${RAG_EMBEDDER:-minilm}
      - LISTS_AUTO_DOWNLOAD=${LISTS_AUTO_DOWNLOAD:-true}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Scheduled pg_dump (S4.5). Archives land in ./backups on the host (BACKUP_HOST_DIR).
  # Same image as the database, so pg_dump matches the server version. Runbook: DEPLOYMENT.md.
  backup:
    image: pgvector/pgvector:pg16
    container_name: finshield-backup
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do sh /scripts/backup.sh || echo "backup: FAILED" >&2; sleep "$${BACKUP_INTERVAL_SECONDS}"; done'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finshield}
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-35}
      - BACKUP_MIN_KEEP=${BACKUP_MIN_KEEP:-7}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      # Healthy while the newest archive is younger than two intervals.
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name 'finshield-*.dump' -mmin -$$((BACKUP_INTERVAL_SECONDS / 30)))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: platform-app/Dockerfile
    container_name: finshield-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8091
      - NEXT_PUBLIC_API_URL=http://localhost:8091
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finshield-network

volumes:
  redis-data:
    driver: local
  backend-data:
    driver: local
  postgres-data:
    driver: local

networks:
  finshield-network:
    driver: bridge
