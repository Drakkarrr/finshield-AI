version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finshield-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=finshield
      - POSTGRES_PASSWORD=finshield_secret
      - POSTGRES_DB=finshield
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - finshield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finshield-backend
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=sqlite:///./finshield.db
      - RAG_DATABASE_URL=postgresql://finshield:finshield_secret@postgres:5432/finshield
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finshield-network

  frontend:
    build:
      context: .
      dockerfile: platform-app/Dockerfile
    container_name: finshield-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8091
      - NEXT_PUBLIC_API_URL=http://localhost:8091
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finshield-network

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local

networks:
  finshield-network:
    driver: bridge
