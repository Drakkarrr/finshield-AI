version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finshield-backend
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=sqlite:///./finshield.db
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - finshield-network

  frontend:
    build:
      context: .
      dockerfile: platform-app/Dockerfile
    container_name: finshield-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8091
      - NEXT_PUBLIC_API_URL=http://localhost:8091
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finshield-network

volumes:
  backend-data:
    driver: local

networks:
  finshield-network:
    driver: bridge
